ntitas dan legalitas usaha','Dokumen sesuai ketentuan'],terms:['Mata uang','Saldo minimum','Biaya administrasi']},{n:'KPR BRI',c:1,g:'Individu',d:'Pembiayaan untuk kebutuhan rumah Anda.',who:'RM Consumer',a:'Konsultasi Pengajuan',docs:['Identitas pemohon','Dokumen penghasilan','Dokumen properti'],terms:['Tenor','Uang muka','Bunga & biaya']},{n:'BRIguna',c:1,g:'Individu',d:'Pembiayaan untuk kebutuhan pegawai.',who:'RM Consumer',a:'Konsultasi Pengajuan',docs:['Identitas pemohon','Dokumen penghasilan','Dokumen pendukung'],terms:['Plafon','Tenor','Bunga & biaya']},{n:'KUR',c:1,g:'Usaha',d:'Pembiayaan untuk kebutuhan usaha mikro dan kecil.',who:'Petugas Mikro / Mantri',a:'Konsultasi Pengajuan',docs:['Identitas pemohon','Dokumen usaha','Dokumen pendukung'],terms:['Plafon','Tenor','Bunga & skema angsuran']},{n:'Kupedes',c:1,g:'Usaha',d:'Pembiayaan usaha untuk kebutuhan produktif.',who:'Petugas Mikro / Mantri',a:'Konsultasi Pengajuan',docs:['Identitas pemohon','Dokumen usaha','Dokumen pendukung'],terms:['Plafon','Tenor','Bunga & biaya']},{n:'KMK (Kredit Modal Kerja)',c:1,g:'Usaha',d:'Pembiayaan modal kerja untuk mendukung usaha.',who:'RM Small/SME',a:'Konsultasi Pengajuan',docs:['Identitas dan legalitas usaha','Dokumen keuangan usaha','Dokumen pendukung'],terms:['Plafon','Tenor','Bunga & biaya']},{n:'Kredit Investasi',c:1,g:'Usaha',d:'Pembiayaan investasi untuk pengembangan usaha.',who:'RM Small/SME',a:'Konsultasi Pengajuan',docs:['Identitas dan legalitas usaha','Dokumen rencana investasi','Dokumen keuangan'],terms:['Plafon','Tenor','Bunga & biaya']},{n:'Bank Garansi',c:2,g:null,d:'Informasi jaminan bank untuk kebutuhan bisnis.',who:'Petugas Trade',a:'Konsultasi Layanan',docs:['Identitas dan legalitas usaha','Dokumen transaksi/proyek','Dokumen pendukung'],terms:['Jenis jaminan','Biaya','Masa berlaku']},{n:'Remittance International',c:2,g:null,d:'Informasi pengiriman dan penerimaan dana internasional.',who:'Petugas Layanan Internasional',a:'Konsultasi Layanan',docs:['Identitas sesuai ketentuan','Informasi transaksi','Dokumen pendukung'],terms:['Mata uang','Biaya','Waktu pemrosesan']},{n:'Kurs Beli',c:2,g:null,d:'Informasi kurs beli valuta asing.',who:'Petugas Trade',a:'Konsultasi Layanan',docs:['Identitas sesuai ketentuan','Dokumen transaksi'],terms:['Mata uang','Waktu pembaruan','Ketentuan transaksi']},{n:'Kurs Jual',c:2,g:null,d:'Informasi kurs jual valuta asing.',who:'Petugas Trade',a:'Konsultasi Layanan',docs:['Identitas sesuai ketentuan','Dokumen transaksi'],terms:['Mata uang','Waktu pembaruan','Ketentuan transaksi']},{n:'Proteksi BRI Life',c:3,g:null,d:'Temukan informasi perlindungan sesuai kebutuhan Anda.',who:'Petugas Bancassurance',a:'Konsultasi Proteksi',docs:['Identitas calon pemegang polis','Dokumen sesuai produk asuransi'],terms:['Manfaat & premi','Risiko & pengecualian','Ketentuan polis']}];;const ic=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const back=(page='home')=>`<button class="back" data-page="${page}">${ic('arrow-left')} Kembali</button>`;const tile=(c,i)=>`<button class="tile" data-cat="${i}"><span class="icon">${ic(c[2])}</span>${c[0]}<small>${c[1]}</small></button>`;const card=(p)=>`<button class="product" data-product="${products.indexOf(p)}"><span class="label">${cats[p.c][0]}</span><strong>${p.n}</strong><small>${p.d}</small><span class="link">Lihat detail </span></button>`;function draw(html,nav='home'){screen.innerHTML=html;root.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===nav));if(typeof lucide!=='undefined')lucide.createIcons();}function home(){draw(`<section class="mlati-hero"><div class="mlati-hero-copy"><span class="mlati-kicker">BO YOGYAKARTA MLATI</span><h1>MLATI</h1><p class="mlati-tagline">Media Layanan dan Akses<br class="desktop-break"> Terpadu Informasi</p><p class="mlati-description">Temukan informasi produk dan layanan perbankan dalam satu ruang yang mudah diakses.</p><button class="mlati-hero-button" data-page="explore">Jelajahi layanan <span></span></button></div><div class="mlati-visual" aria-hidden="true"><div class="mlati-glow"></div><div class="bri-card"><div class="bri-card-top"><strong>BRI</strong><span>BO MLATI</span></div><div class="bri-card-chip"></div><div class="bri-card-number"> &nbsp;  &nbsp;  &nbsp; 2026</div><div class="bri-card-bottom"><span>LAYANAN TERPADU</span><b></b></div></div><div class="mlati-float"><span></span> Informasi lebih dekat</div></div></section><div class="services-intro"><span class="overline">LAYANAN BO YOGYAKARTA MLATI</span><h2>Temukan layanan yang sesuai kebutuhan Anda</h2><p>Pilih kategori untuk melihat informasi produk, persyaratan, dan langkah berikutnya.</p></div><div class="grid">${cats.map(tile).join('')}</div>`)}function groupCard(name,i){const count=products.filter(p=>p.c===i&&p.g===name).length;return `<button class="product group-card" data-group="${i}|${name}"><span class="label">${count} layanan</span><strong>${name}</strong><small>Lihat pilihan ${name.toLowerCase()} dalam kategori ini.</small><span class="link">Buka kelompok </span></button>`}function list(i){currentCategory=i;currentGroup=null;if(i===5)return help();const groups=[...new Set(products.filter(p=>p.c===i&&p.g).map(p=>p.g))];if(groups.length)return draw(`${back()}<span class="label">Kategori layanan</span><h2 style="margin-top:14px">${cats[i][0]}</h2><p>${cats[i][1]}. Pilih kelompok layanan untuk melihat produknya.</p><div class="list">${groups.map(g=>groupCard(g,i)).join('')}</div>`,'explore');const items=products.filter(p=>p.c===i);draw(`${back()}<h2>${cats[i][0]}</h2><p>${cats[i][1]}.</p><div class="list">${items.map(card).join('')}</div>`,'explore')}function groupList(i,g){currentCategory=i;currentGroup=g;const items=products.filter(p=>p.c===i&&p.g===g);draw(`${back('category')}<span class="label">${cats[i][0]}</span><h2 style="margin-top:14px">${g}</h2><p>Pilih layanan untuk melihat informasi produk dan persyaratannya.</p><div class="list">${items.map(card).join('')}</div>`,'explore')}function detail(i){selected=products[i];currentCategory=selected.c;currentGroup=selected.g;const p=selected;draw(`${back(p.g?'group':'category')}<span class="label">${cats[p.c][0]}</span><h2 style="margin-top:14px">${p.n}</h2><p>${p.d}</p><div class="box"><h3>Ringkasan ketentuan</h3>${p.terms.map(t=>`<div class="row"><span>${t}</span><strong>Menunggu validasi</strong></div>`).join('')}<div class="note">Nilai bunga, biaya, dan ketentuan akan diisi dari sumber resmi yang disetujui.</div></div><details open><summary>Dokumen yang perlu disiapkan</summary>${p.docs.map(d=>`<label class="check"><input type="checkbox">${d}</label>`).join('')}</details><details><summary>Bagaimana alurnya</summary><p>Pelajari informasi  siapkan dokumen  lanjutkan melalui kanal resmi atau konsultasi dengan ${p.who}.</p></details><details><summary>Pertanyaan umum</summary><p>Apakah layanan tersedia di cabang saya<br>Petugas akan mengonfirmasi ketersediaan serta ketentuan sesuai kebutuhan Anda.</p></details><button class="action" data-page="${['Buka Rekening','Daftar QRIS'].includes(p.a)?'channel':'contact'}">${p.a} </button><button class="action secondary" data-page="contact">${ic('message-circle')} Tanya Petugas</button><div class="note">Sumber dan tanggal pembaruan: diisi setelah validasi konten.<br>Contoh tampilan  bukan penawaran atau persetujuan produk.</div>`,'explore')}function help(){draw(`${back()}<h2>Bantuan & konsultasi</h2><p>Temukan petugas sesuai kebutuhan Anda.</p><div class="list">${cats.slice(0,4).map((c,i)=>`<button class="product" data-help="${i}">${ic(c[2])}<strong>${c[0]}</strong><small>Konsultasi dengan petugas terkait </small></button>`).join('')}</div><details><summary>Apakah saya perlu login</summary><p>Informasi produk dapat diakses tanpa login. Pembukaan dan pengajuan dilanjutkan melalui kanal resmi.</p></details>`,'help')}function contact(){const p=selected||products[0];draw(`${back('detail')}<h2>Konsultasi ${p.n}</h2><p>Dapatkan penjelasan dari petugas sesuai layanan.</p><div class="box"><span class="label">Petugas terkait</span><h3 style="margin-top:16px">${p.who}</h3><p>BRI BO Yogyakarta Mlati</p><div class="row"><span>Kontak kedinasan</span><strong>Belum diisi</strong></div><div class="row"><span>Jam layanan</span><strong>Menunggu konfirmasi</strong></div></div><button class="action whatsapp-action" data-page="whatsapp"><span class="wa-mark"><svg class="wa-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.6-4.3A8 8 0 1 1 20 11.5Z"/><path d="M8.5 8.2c.3 2.3 2.2 4.4 4.6 5.2l1.4-1.1 1.3.7c.3.2.4.6.2.9l-.7 1c-.4.6-1.1.8-1.8.6-3.7-1-6.2-3.8-6.4-6.1-.1-.7.3-1.4 1-1.6l1.1-.3.6.7-.3 1.1Z"/></svg></span> Hubungi via WhatsApp</button><p class="note">Tombol ini hanya pratinjau. Prototipe tidak membuka WhatsApp atau mengirim pesan.</p>`,'help')}function whatsapp(){const p=selected||products[0];draw(`${back('contact')}<div class="whatsapp-preview"><div class="wa-preview-icon"><svg class="wa-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.6-4.3A8 8 0 1 1 20 11.5Z"/><path d="M8.5 8.2c.3 2.3 2.2 4.4 4.6 5.2l1.4-1.1 1.3.7c.3.2.4.6.2.9l-.7 1c-.4.6-1.1.8-1.8.6-3.7-1-6.2-3.8-6.4-6.1-.1-.7.3-1.4 1-1.6l1.1-.3.6.7-.3 1.1Z"/></svg></div><span class="label wa-label">PRATINJAU KONTAK</span><h2>Hubungi lewat WhatsApp</h2><p>Anda akan diarahkan ke percakapan WhatsApp resmi untuk layanan <strong>${p.n}</strong>.</p><div class="box wa-box"><div class="wa-row"><span class="wa-avatar">BRI</span><div><strong>BRI BO Yogyakarta Mlati</strong><small>Nomor resmi diisi saat implementasi</small></div></div><div class="wa-message">Halo, saya ingin mendapatkan informasi tentang ${p.n}.</div></div><button class="action whatsapp-action" data-page="home"><span class="wa-mark"></span> Kembali ke layanan</button><p class="note">Simulasi prototipe: tidak ada tautan eksternal, pesan, atau data yang dikirim.</p></div>`,'help')}function request(){draw(`${back('contact')}<h2>Minta dihubungi</h2><p>Kebutuhan: ${selected.n}</p><form id="bri-request"><label class="field">Nama contoh<input required placeholder="Contoh: Nasabah Demo" autocomplete="off"></label><label class="field">Nomor kontak contoh<input required placeholder="Gunakan nomor fiktif" inputmode="tel" autocomplete="off"></label><label class="field">Pertanyaan<textarea rows="3" placeholder="Saya ingin mengetahui persyaratannya"></textarea></label><label class="check"><input type="checkbox" required>Saya bersedia dihubungi terkait kebutuhan ini.</label><button class="action">Kirim Permintaan</button></form><div class="note">Simulasi saja. Data tidak disimpan atau dikirim. Gunakan identitas fiktif.</div>`,'help')}function finder(){const needs=[['Menabung sehari-hari',0],['Menempatkan dana berjangka',2],['Mendapatkan modal usaha',3],['Membeli rumah',5],['Menerima pembayaran pelanggan',6],['Melindungi diri dan keluarga',10],['Mendukung transaksi perdagangan',8]];draw(`${back()}<span class="label">Bantu Saya Memilih</span><h2 style="margin-top:14px">Apa kebutuhan Anda</h2><p>Pilih kebutuhan untuk melihat contoh produk terkait.</p><div class="list">${needs.map(([n,i])=>`<button class="product" data-recommend="${i}">${n} </button>`).join('')}</div>`)}function channel(){draw(`${back('detail')}<h2>Lanjut ke kanal resmi</h2><p>${selected.a==='Buka Rekening'?'Pembukaan rekening dilanjutkan melalui kanal resmi BRI, seperti BRImo.':'Pendaftaran merchant dilanjutkan melalui kanal resmi BRI.'}</p><div class="box"><h3>${selected.n}</h3><p>Identitas dan dokumen pengajuan diisi di kanal resmi sesuai ketentuannya.</p><span class="label">Simulasi pengalihan</span></div><button class="action" data-page="contact">Konsultasi Terlebih Dahulu</button><div class="note">Prototipe ini tidak membuka kanal eksternal. Tautan resmi ditetapkan saat implementasi.</div>`,'explore')}const pages={home,help,contact,whatsapp,request,finder,channel,detail:()=>detail(products.indexOf(selected||products[0])),category:()=>list(currentCategory),group:()=>currentGroup?groupList(currentCategory,currentGroup):list(currentCategory),explore:()=>draw(`${back()}<h2>Semua layanan</h2><p>Temukan produk berdasarkan kategori.</p><div class="grid">${cats.map(tile).join('')}</div>`,'explore')};root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)pages[b.dataset.nav]();else if(b.dataset.page)pages[b.dataset.page]();else if(b.dataset.cat!==undefined)list(+b.dataset.cat);else if(b.dataset.product!==undefined)detail(+b.dataset.product);else if(b.dataset.group){const [i,g]=b.dataset.group.split('|');groupList(+i,g)}else if(b.dataset.help!==undefined){selected=products.find(p=>p.c===+b.dataset.help);contact()}else if(b.dataset.recommend!==undefined){const p=products[+b.dataset.recommend];draw(`${back('finder')}<h2>Pilihan untuk kebutuhan Anda</h2><p>${p.d}</p>${card(p)}<div class="note">Pilihan berdasarkan kategori kebutuhan. Kesesuaian akhir dikonfirmasi bersama petugas.</div>`)}});root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='bri-search'){const q=e.target.querySelector('input').value.trim().toLowerCase();const matches=products.filter(p=>(p.n+' '+p.d+' '+cats[p.c][0]).toLowerCase().includes(q));draw(`${back()}<h2>Hasil pencarian</h2><p>${matches.length} produk/layanan ditemukan.</p><div class="list">${matches.map(card).join('')||'<div class="box">Belum ada hasil. Coba cari KUR, tabungan, atau QRIS.</div>'}</div>`,'explore')}else if(e.target.id==='bri-request')draw(`<div class="success"><span class="icon">${ic('check')}</span><h2>Simulasi berhasil</h2><p>Permintaan konsultasi untuk ${selected.n} selesai dicoba.</p><p>Dalam sistem final, permintaan diteruskan kepada petugas dan status tindak lanjut dapat ditampilkan.</p><button class="action" data-page="home">Kembali ke Beranda</button><div class="note">Tidak ada data yang disimpan atau dikirim.</div></div>`,'help')});home();})();
</script>

 };
